{% extends "base.html" %}

{% block title %}
    {{ page_title|default("Tenant Portal") }} | Smart Property AI
{% endblock %}

{% block extra_css %}
    {{ super() }}
    <link rel="stylesheet" href="{{ url_for('static', path='css/tenant.css') }}">
    {% block tenant_extra_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="tenant-layout" data-tenant-layout>
    <!-- (optional tenant navigation / sidebar could go here) -->
    <main class="tenant-layout__main" id="main-content">
        {% block tenant_content %}{% endblock %}
    </main>
</div>
{% endblock %}
